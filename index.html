<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Found</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0f1115;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a2f36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #1a2030, transparent 60%),
        var(--bg);
      color: var(--text);
      text-align: center;
    }
    p.code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    p.msg {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 22rem;
      margin: 0 auto;
    }
    hr {
      width: 48px;
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px auto;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Not Found</h1>
    <hr />
    <p class="msg">This page isn’t available right now.</p>
  </main>
</body>
</html>
